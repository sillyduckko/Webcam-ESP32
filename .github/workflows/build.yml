name: Build USB Webcam Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: idf.py build && idf.py merge-bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-S3-USB-Webcam
          path: build/merged-binary.bin
